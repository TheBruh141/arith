[package]
name = "arith"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
clap_complete = "4.5.61"
miette = { version = "7.6.0", features = ["fancy"] }
log = "0.4.29"
env_logger = "0.11.8"
thiserror = "2.0.17"
logos = "0.16.0"
chumsky = "0.9.3"
ariadne = "0.6.0"
[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"]  }

[[bench]]
name = "simple"
harness = false